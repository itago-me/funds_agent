<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Funds Agent Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero panel">
        <div>
          <p class="eyebrow">Funds Agent</p>
          <h1>每日基金智能分析看板</h1>
          <p class="hero-copy">
            从本地报告、任务日志、自选基金和历史快照中读取数据，用一个轻量页面展示 Agent 的运行结果。
          </p>
        </div>
        <div class="status-card">
          <span id="api-status-dot" class="status-dot"></span>
          <div>
            <p class="muted">API 状态</p>
            <strong id="api-status-text">检查中...</strong>
          </div>
        </div>
      </section>

      <section class="metric-grid">
        <article class="metric-card">
          <span>自选基金</span>
          <strong id="watchlist-count">-</strong>
        </article>
        <article class="metric-card">
          <span>最近任务</span>
          <strong id="task-count">-</strong>
        </article>
        <article class="metric-card">
          <span>历史快照</span>
          <strong id="snapshot-count">-</strong>
        </article>
        <article class="metric-card">
          <span>最新报告日期</span>
          <strong id="latest-report-date">-</strong>
        </article>
      </section>

      <section class="dashboard-grid">
        <article class="panel report-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Latest Report</p>
              <h2>最新基金报告</h2>
            </div>
            <div class="button-row">
              <button id="run-watchlist-report-button" type="button">生成自选日报</button>
              <button id="refresh-button" type="button">刷新数据</button>
            </div>
          </div>
          <div class="report-options" aria-label="日报生成选项">
            <label class="option-toggle">
              <input id="report-use-real-data" type="checkbox" checked />
              <span>真实数据</span>
            </label>
            <label class="option-toggle">
              <input id="report-use-llm" type="checkbox" />
              <span>LLM 分析</span>
            </label>
          </div>
          <div id="report-action-message" class="form-message"></div>
          <div id="report-meta" class="meta-line">正在加载最新报告...</div>
          <div id="report-detail-meta" class="report-detail-meta loading">加载中...</div>
          <div id="latest-report" class="markdown-body loading">加载中...</div>
        </article>

        <aside class="side-column">
          <article class="panel">
            <div class="section-heading compact">
              <h2>自选基金</h2>
            </div>
            <form id="watchlist-form" class="watchlist-form">
              <label class="sr-only" for="watchlist-input">基金代码</label>
              <input
                id="watchlist-input"
                name="fund_code"
                type="text"
                inputmode="numeric"
                placeholder="输入基金代码"
                autocomplete="off"
              />
              <button id="watchlist-add-button" type="submit">添加</button>
            </form>
            <div id="watchlist-message" class="form-message"></div>
            <div id="watchlist" class="chip-list loading">加载中...</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>临时查询</h2>
            </div>
            <form id="fund-lookup-form" class="watchlist-form">
              <label class="sr-only" for="fund-lookup-input">基金代码</label>
              <input
                id="fund-lookup-input"
                name="fund_code"
                type="text"
                inputmode="numeric"
                placeholder="查询基金代码"
                autocomplete="off"
              />
              <button id="fund-lookup-button" type="submit">查询</button>
            </form>
            <label class="option-toggle inline-option">
              <input id="fund-lookup-use-real-data" type="checkbox" checked />
              <span>真实数据</span>
            </label>
            <div id="fund-lookup-message" class="form-message"></div>
            <div id="fund-lookup-result" class="lookup-result empty">暂无查询结果。</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>历史报告</h2>
            </div>
            <div id="report-history" class="report-history loading">加载中...</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>最近任务</h2>
            </div>
            <div id="task-runs" class="timeline loading">加载中...</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>基金快照</h2>
            </div>
            <div id="fund-snapshots" class="snapshot-list loading">加载中...</div>
          </article>
        </aside>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
