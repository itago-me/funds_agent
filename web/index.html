<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Funds Agent Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero panel">
        <div>
          <p class="eyebrow">Funds Agent</p>
          <h1>每日基金智能分析看板</h1>
          <!--<p class="hero-copy">
            从本地报告、任务日志、自选基金和历史快照中读取数据，用一个轻量页面展示 Agent 的运行结果。
          </p> -->
        </div>
        <div class="status-card">
          <span id="api-status-dot" class="status-dot"></span>
          <div>
            <p class="muted">API 状态</p>
            <strong id="api-status-text">检查中...</strong>
          </div>
        </div>
      </section>

      <section class="metric-grid">
        <article class="metric-card">
          <span>自选基金</span>
          <strong id="watchlist-count">-</strong>
        </article>
        <article class="metric-card">
          <span>最近任务</span>
          <strong id="task-count">-</strong>
        </article>
        <article class="metric-card">
          <span>历史快照</span>
          <strong id="snapshot-count">-</strong>
        </article>
        <article class="metric-card">
          <span>最新报告日期</span>
          <strong id="latest-report-date">-</strong>
        </article>
      </section>

      <section id="schedule-status" class="schedule-status panel loading">加载运行状态...</section>

      <section class="dashboard-grid">
        <article class="panel report-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Latest Report</p>
              <h2>最新基金报告</h2>
            </div>
            <div class="button-row">
              <button id="run-watchlist-report-button" type="button">生成自选日报</button>
              <button id="refresh-button" type="button">刷新数据</button>
            </div>
          </div>
          <div class="report-options" aria-label="日报生成选项">
            <label class="option-toggle">
              <input id="report-use-real-data" type="checkbox" checked />
              <span>真实数据</span>
            </label>
            <label class="option-toggle">
              <input id="report-use-llm" type="checkbox" />
              <span>LLM 分析</span>
            </label>
          </div>
          <div id="report-action-message" class="form-message"></div>
          <div id="report-meta" class="meta-line">正在加载最新报告...</div>
          <div id="report-detail-meta" class="report-detail-meta loading">加载中...</div>
          <div id="latest-report" class="markdown-body loading">加载中...</div>
        </article>

        <aside class="side-column">
          <article class="panel">
            <div class="section-heading compact">
              <h2>自选基金</h2>
            </div>
            <form id="watchlist-form" class="watchlist-form">
              <label class="sr-only" for="watchlist-input">基金代码</label>
              <input
                id="watchlist-input"
                name="fund_code"
                type="text"
                inputmode="numeric"
                placeholder="输入基金代码"
                autocomplete="off"
              />
              <button id="watchlist-add-button" type="submit">添加</button>
            </form>
            <div id="watchlist-message" class="form-message"></div>
            <div id="watchlist" class="chip-list loading">加载中...</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>临时查询</h2>
            </div>
            <form id="fund-lookup-form" class="watchlist-form">
              <label class="sr-only" for="fund-lookup-input">基金代码</label>
              <input
                id="fund-lookup-input"
                name="fund_code"
                type="text"
                inputmode="numeric"
                placeholder="查询基金代码"
                autocomplete="off"
              />
              <button id="fund-lookup-button" type="submit">查询</button>
            </form>
            <label class="option-toggle inline-option">
              <input id="fund-lookup-use-real-data" type="checkbox" checked />
              <span>真实数据</span>
            </label>
            <div id="fund-lookup-message" class="form-message"></div>
            <div id="fund-lookup-result" class="lookup-result empty">暂无查询结果。</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>基金详情</h2>
            </div>
            <form id="fund-trend-filter-form" class="filter-form compact-filter">
              <label>
                <span>开始</span>
                <input id="fund-trend-start-date" name="start_date" type="date" />
              </label>
              <label>
                <span>结束</span>
                <input id="fund-trend-end-date" name="end_date" type="date" />
              </label>
              <div class="filter-actions">
                <button id="fund-trend-filter-button" type="submit">应用</button>
                <button id="fund-trend-reset-button" type="button" data-filter-reset="fund-trend">清空</button>
              </div>
            </form>
            <div id="fund-detail-message" class="form-message"></div>
            <div id="fund-detail-result" class="fund-detail empty">从自选基金或临时查询结果中打开详情。</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>历史报告</h2>
            </div>
            <form id="report-filter-form" class="filter-form">
              <label>
                <span>开始</span>
                <input id="report-filter-start-date" name="start_date" type="date" />
              </label>
              <label>
                <span>结束</span>
                <input id="report-filter-end-date" name="end_date" type="date" />
              </label>
              <label>
                <span>基金</span>
                <input
                  id="report-filter-fund-code"
                  name="fund_code"
                  type="text"
                  inputmode="numeric"
                  placeholder="基金代码"
                  autocomplete="off"
                />
              </label>
              <label>
                <span>数据源</span>
                <input
                  id="report-filter-data-source"
                  name="data_source"
                  type="text"
                  placeholder="akshare"
                  autocomplete="off"
                />
              </label>
              <div class="filter-actions">
                <button id="report-filter-button" type="submit">筛选</button>
                <button id="report-filter-reset-button" type="button" data-filter-reset="reports">清空</button>
              </div>
            </form>
            <div id="report-history" class="report-history loading">加载中...</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>最近任务</h2>
            </div>
            <form id="task-filter-form" class="filter-form">
              <label>
                <span>状态</span>
                <select id="task-filter-status" name="status">
                  <option value="">全部</option>
                  <option value="success">success</option>
                  <option value="failed">failed</option>
                </select>
              </label>
              <label>
                <span>开始</span>
                <input id="task-filter-start-date" name="start_date" type="date" />
              </label>
              <label>
                <span>结束</span>
                <input id="task-filter-end-date" name="end_date" type="date" />
              </label>
              <label>
                <span>报告</span>
                <select id="task-filter-has-report" name="has_report">
                  <option value="">全部</option>
                  <option value="true">有关联</option>
                  <option value="false">未关联</option>
                </select>
              </label>
              <label class="option-toggle filter-check">
                <input id="task-filter-failed-only" name="failed_only" type="checkbox" />
                <span>只看失败</span>
              </label>
              <div class="filter-actions">
                <button id="task-filter-button" type="submit">筛选</button>
                <button id="task-filter-reset-button" type="button" data-filter-reset="tasks">清空</button>
              </div>
            </form>
            <div id="task-runs" class="timeline loading">加载中...</div>
          </article>

          <article class="panel">
            <div class="section-heading compact">
              <h2>基金快照</h2>
            </div>
            <form id="snapshot-filter-form" class="filter-form">
              <label>
                <span>基金</span>
                <input
                  id="snapshot-filter-fund-code"
                  name="fund_code"
                  type="text"
                  inputmode="numeric"
                  placeholder="基金代码"
                  autocomplete="off"
                />
              </label>
              <label>
                <span>开始</span>
                <input id="snapshot-filter-start-date" name="start_date" type="date" />
              </label>
              <label>
                <span>结束</span>
                <input id="snapshot-filter-end-date" name="end_date" type="date" />
              </label>
              <div class="filter-actions">
                <button id="snapshot-filter-button" type="submit">筛选</button>
                <button id="snapshot-filter-reset-button" type="button" data-filter-reset="snapshots">清空</button>
              </div>
            </form>
            <div id="snapshot-filter-message" class="form-message"></div>
            <div id="fund-snapshots" class="snapshot-list loading">加载中...</div>
          </article>
        </aside>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
