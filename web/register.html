<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>创建用户-基金智能体</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="register-page">
    <main class="login-shell">
      <a class="login-brand" href="/">
        <span class="brand-mark-icon">F</span>
        <span>
          <strong>基金智能体</strong>
          <small>funds_agent</small>
        </span>
      </a>

      <section class="register-card">
        <div class="login-heading">
          <p class="eyebrow">Create Account</p>
          <h1>创建新用户</h1>
          <p>注册后即可使用系统的完整功能。</p>
        </div>

        <form id="register-form" class="register-form">
          <label>
            <span>用户名</span>
            <input
              id="register-username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="请输入用户名"
              required
              autofocus
            />
          </label>
          <label>
            <span>密码</span>
            <input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="请输入密码"
              required
            />
          </label>
          <label>
            <span>确认密码</span>
            <input
              id="register-password-confirm"
              name="password_confirm"
              type="password"
              autocomplete="new-password"
              placeholder="再次输入密码"
              required
            />
          </label>
          <button id="register-button" type="submit">注册</button>
        </form>

        <div id="register-message" class="form-message" role="status" aria-live="polite"></div>
        <p class="login-footer">
          <a href="/login">已有账户？返回登录</a>
        </p>
      </section>
    </main>
    <script src="/register.js"></script>
  </body>
</html>
