<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录-基金智能体</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="login-brand" href="/">
        <span class="brand-mark-icon">F</span>
        <span>
          <strong>基金智能体</strong>
          <small>funds_agent</small>
        </span>
      </a>

      <section class="login-card">
        <div class="login-heading">
          <p class="eyebrow">Welcome Back</p>
          <h1>欢迎回来</h1>
          <p>登录账号享受完整服务</p>
        </div>

        <form id="login-form" class="login-form">
          <label>
            <span>用户名</span>
            <input
              id="login-username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="请输入用户名"
              required
              autofocus
            />
          </label>
          <label>
            <span>密码</span>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </label>
          <button id="login-button" type="submit">登录</button>
        </form>

        <div id="login-message" class="form-message" role="status" aria-live="polite"></div>
        <p class="login-footer">
          还没有账户？请使用项目管理员脚本创建用户。
        </p>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
